name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Node 20 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci --include=dev
      - name: Lint boundaries
        run: npm run lint
      - name: Typecheck
        run: node scripts/ci/run-reported-npm.mjs "Typecheck diagnostics" typecheck
      - name: Test
        run: npm test -- --run
      - name: Build application
        run: npm run build
      - name: Build release packages
        run: npm run release:build
